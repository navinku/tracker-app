<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weekly Schedule</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #080808;
      color: #ccc;
      min-height: 100vh;
      overflow-x: auto;
    }

    /* ── Header ─────────────────────────────────────────────── */
    header {
      position: sticky; top: 0; z-index: 200;
      background: #0a0a0a; border-bottom: 1px solid #1c1c1c;
      padding: 0.6rem 1.2rem;
      display: flex; align-items: center; justify-content: space-between;
      height: 52px;
    }
    .hdr-left { display: flex; align-items: center; gap: 1rem; }
    .hdr-left h1 { font-size: 0.95rem; font-weight: 600; color: #fff; letter-spacing: -0.02em; }
    .hdr-left a { font-size: 0.75rem; color: #444; text-decoration: none; }
    .hdr-left a:hover { color: #777; }
    #live-time { font-size: 0.72rem; color: #555; font-variant-numeric: tabular-nums; }
    canvas#clock { display: block; }

    /* ── Table wrapper ───────────────────────────────────────── */
    .wrap { padding: 0.75rem; min-width: 820px; }
    table { border-collapse: collapse; width: 100%; font-size: 0.72rem; }

    /* ── Header row ─────────────────────────────────────────── */
    thead th {
      position: sticky; top: 52px; z-index: 100;
      will-change: transform;
      background: #0f0f0f; color: #555;
      padding: 0.55rem 0.4rem; text-align: center;
      font-weight: 700; font-size: 0.68rem;
      text-transform: uppercase; letter-spacing: 0.06em;
      border: 1px solid #161616;
    }
    thead th .sub { display: block; font-size: 0.55rem; font-weight: 400; color: #333; text-transform: none; letter-spacing: 0; margin-top: 2px; }
    thead th.today-hdr { color: #e0e0e0; background: #0e1628; border-bottom: 2px solid #2563eb; }

    /* ── Body cells ─────────────────────────────────────────── */
    tbody td {
      padding: 0.35rem 0.45rem; border: 1px solid #141414;
      text-align: center; vertical-align: middle; line-height: 1.35;
      position: relative;
    }
    tbody td.time-col {
      white-space: nowrap; font-size: 0.63rem; color: #383838;
      background: #0b0b0b; text-align: right; padding-right: 0.6rem;
      font-variant-numeric: tabular-nums; min-width: 82px; letter-spacing: -0.01em;
    }
    tr.active-row td.time-col { color: #2563eb; font-weight: 700; }

    /* ── Category colours ────────────────────────────────────── */
    .yoga       { background:#130e1e; color:#b197fc; }
    .personal   { background:#080f1e; color:#74b0f7; }
    .worklearn  { background:#12100a; color:#f5c842; }
    .family     { background:#180c14; color:#f7a4ca; }
    .apac       { background:#06111e; color:#38bdf8; }
    .emea       { background:#0d0820; color:#9ca3f0; }
    .us         { background:#06111e; color:#60a5fa; }
    .deep       { background:#180d04; color:#fb923c; }
    .tickets    { background:#180606; color:#f87171; }
    .enhance    { background:#06160d; color:#34d399; }
    .docs       { background:#0c1506; color:#a3e635; }
    .dinner     { background:#180c14; color:#fda4af; }
    .workout    { background:#06150a; color:#4ade80; }
    .community  { background:#100c1a; color:#c084fc; }
    .sleep      { background:#0b0b0b; color:#374151; }
    .off        { background:#080808; color:#252525; }

    /* ── Active cell ─────────────────────────────────────────── */
    td.active-cell {
      outline: 2px solid #2563eb !important; outline-offset: -2px;
      font-weight: 700 !important; position: relative; z-index: 5;
      filter: brightness(1.55); box-shadow: inset 0 0 18px rgba(37,99,235,0.18);
      animation: ring 2s ease-out infinite;
    }
    td.active-cell::before {
      content: ''; position: absolute; inset: 0;
      background: rgba(37,99,235,0.06); pointer-events: none;
    }
    @keyframes ring {
      0%   { box-shadow: inset 0 0 0 0 rgba(37,99,235,0.5), inset 0 0 18px rgba(37,99,235,0.18); }
      70%  { box-shadow: inset 0 0 0 4px rgba(37,99,235,0), inset 0 0 18px rgba(37,99,235,0.18); }
      100% { box-shadow: inset 0 0 0 0 rgba(37,99,235,0), inset 0 0 18px rgba(37,99,235,0.18); }
    }

    /* ── Editable cell hover ─────────────────────────────────── */
    tbody td:not(.time-col) {
      cursor: pointer;
    }
    tbody td:not(.time-col):hover .edit-icon { opacity: 1; }

    .edit-icon {
      position: absolute; top: 3px; right: 4px;
      font-size: 0.55rem; opacity: 0;
      transition: opacity 0.15s; pointer-events: none;
      color: rgba(255,255,255,0.35);
    }

    /* overridden cell gets a small dot indicator */
    td.overridden::after {
      content: '';
      position: absolute; bottom: 3px; right: 4px;
      width: 4px; height: 4px; border-radius: 50%;
      background: #2563eb; opacity: 0.7;
    }

    /* ── Footer ─────────────────────────────────────────────── */
    tfoot td {
      padding: 0.4rem 0.5rem; border: 1px solid #161616;
      text-align: center; font-size: 0.65rem; color: #444; background: #0d0d0d;
    }
    tfoot td.time-col { text-align: right; color: #2e2e2e; font-size: 0.6rem; }
    tfoot td b { color: #e0e0e0; }

    /* ── Edit popover ────────────────────────────────────────── */
    #edit-popover {
      position: fixed; z-index: 999;
      background: #141414; border: 1px solid #2a2a2a; border-radius: 10px;
      padding: 1rem; width: 260px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.6);
      display: none;
    }
    #edit-popover h4 {
      font-size: 0.65rem; color: #444; text-transform: uppercase;
      letter-spacing: 0.08em; margin-bottom: 0.7rem;
    }
    #edit-popover input[type=text] {
      width: 100%; background: #1e1e1e; border: 1px solid #2a2a2a;
      border-radius: 6px; color: #e0e0e0; font-size: 0.8rem;
      padding: 0.45rem 0.6rem; margin-bottom: 0.6rem;
      font-family: inherit; outline: none;
    }
    #edit-popover input[type=text]:focus { border-color: #444; }

    .cat-grid {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px;
      margin-bottom: 0.75rem;
    }
    .cat-btn {
      padding: 0.3rem 0.2rem; border-radius: 5px; border: 1px solid transparent;
      font-size: 0.55rem; text-align: center; cursor: pointer;
      font-weight: 600; letter-spacing: 0.02em; transition: border-color 0.1s;
    }
    .cat-btn.selected { border-color: #fff !important; }

    .cat-btn.yoga       { background:#130e1e; color:#b197fc; }
    .cat-btn.personal   { background:#080f1e; color:#74b0f7; }
    .cat-btn.worklearn  { background:#12100a; color:#f5c842; }
    .cat-btn.family     { background:#180c14; color:#f7a4ca; }
    .cat-btn.apac       { background:#06111e; color:#38bdf8; }
    .cat-btn.emea       { background:#0d0820; color:#9ca3f0; }
    .cat-btn.us         { background:#06111e; color:#60a5fa; }
    .cat-btn.deep       { background:#180d04; color:#fb923c; }
    .cat-btn.tickets    { background:#180606; color:#f87171; }
    .cat-btn.enhance    { background:#06160d; color:#34d399; }
    .cat-btn.docs       { background:#0c1506; color:#a3e635; }
    .cat-btn.dinner     { background:#180c14; color:#fda4af; }
    .cat-btn.workout    { background:#06150a; color:#4ade80; }
    .cat-btn.community  { background:#100c1a; color:#c084fc; }
    .cat-btn.sleep      { background:#0b0b0b; color:#374151; }
    .cat-btn.off        { background:#0a0a0a; color:#444; border-color:#1a1a1a !important; }

    .pop-actions { display: flex; gap: 0.5rem; }
    .pop-save {
      flex: 1; padding: 0.45rem; background: #2563eb; color: #fff;
      border: none; border-radius: 6px; font-size: 0.75rem;
      font-weight: 600; cursor: pointer;
    }
    .pop-save:hover { background: #1d4ed8; }
    .pop-reset {
      padding: 0.45rem 0.7rem; background: transparent;
      border: 1px solid #2a2a2a; color: #555; border-radius: 6px;
      font-size: 0.72rem; cursor: pointer;
    }
    .pop-reset:hover { border-color: #555; color: #999; }
    .pop-close {
      position: absolute; top: 0.5rem; right: 0.6rem;
      background: none; border: none; color: #444; font-size: 1rem;
      cursor: pointer; line-height: 1;
    }
    .pop-close:hover { color: #aaa; }
  </style>
</head>
<body>

<header>
  <div class="hdr-left">
    <h1>Weekly Schedule — IST</h1>
    <a href="dashboard.html">← Dashboard</a>
    <a href="dayplan.html">Ideal Day</a>
    <span id="live-time"></span>
  </div>
  <canvas id="clock" width="60" height="60"></canvas>
</header>

<div class="wrap">
  <table>
    <thead>
      <tr>
        <th>Time IST</th>
        <th id="h0">Mon<span class="sub">8.5 h</span></th>
        <th id="h1">Tue<span class="sub">8 h</span></th>
        <th id="h2">Wed<span class="sub">8.5 h</span></th>
        <th id="h3">Thu<span class="sub">8 h</span></th>
        <th id="h4">Fri<span class="sub">7 h</span></th>
        <th id="h5">Sat<span class="sub">school 07:30</span></th>
        <th id="h6">Sun<span class="sub">no work</span></th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
    <tfoot>
      <tr>
        <td class="time-col">40h budget</td>
        <td colspan="5" style="text-align:left;color:#333;font-size:0.6rem;">
          APAC <b>2.5h</b> &nbsp;·&nbsp; EMEA <b>5h</b> &nbsp;·&nbsp; US <b>1.5h</b> &nbsp;·&nbsp;
          Work Learn <b>5h</b> &nbsp;·&nbsp; Deep Work <b>13h</b> &nbsp;·&nbsp;
          Tickets <b>6h</b> &nbsp;·&nbsp; Enhance <b>2h</b> &nbsp;·&nbsp; Docs <b>5h</b>
        </td>
        <td>0h ✓</td>
        <td>0h ✓</td>
      </tr>
    </tfoot>
  </table>
</div>

<!-- Edit popover -->
<div id="edit-popover">
  <button class="pop-close" id="pop-close">×</button>
  <h4 id="pop-title">Edit cell</h4>
  <input type="text" id="pop-label" placeholder="Label">
  <div class="cat-grid" id="cat-grid"></div>
  <div class="pop-actions">
    <button class="pop-save" id="pop-save">Save</button>
    <button class="pop-reset" id="pop-reset">Reset</button>
  </div>
</div>

<script src="schedule-data.js"></script>
<script>
const token = localStorage.getItem('token');
if (!token) window.location.href = 'login.html';

/* ─── State ─────────────────────────────────────────────────────────── */
let overrides = {};      // "ri_di" → {label, category}
let activeEdit = null;   // {ri, di, origLabel, origCat}
let selectedCat = '';
let effectiveRows = [];

/* ─── Load overrides then render ────────────────────────────────────── */
async function init() {
  const res = await fetch('/schedule/overrides', { headers: { 'Authorization': token } });
  if (res.status === 401 || res.status === 403) { window.location.href = 'login.html'; return; }
  const data = await res.json();
  overrides = {};
  data.forEach(o => { overrides[`${o.row_idx}_${o.day_idx}`] = { label: o.label, category: o.category }; });
  effectiveRows = applyOverrides(SCHEDULE_ROWS, data);
  buildTable();
  highlight();
  updateTime();
}

/* ─── Build table ────────────────────────────────────────────────────── */
function buildTable() {
  const tbody = document.getElementById('tbody');
  tbody.innerHTML = '';

  effectiveRows.forEach((row, ri) => {
    const tr = document.createElement('tr');
    tr.id = 'r' + ri;

    const tc = document.createElement('td');
    tc.className = 'time-col';
    tc.textContent = row.time;
    tr.appendChild(tc);

    row.cells.forEach((cell, di) => {
      const td = document.createElement('td');
      td.id = `c${ri}_${di}`;
      td.className = cell[1];
      if (overrides[`${ri}_${di}`]) td.classList.add('overridden');
      td.innerHTML = `<span class="edit-icon">✎</span>${cell[0]}`;
      td.addEventListener('click', e => openEdit(e, ri, di));
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });
}

/* ─── Active cell highlight ─────────────────────────────────────────── */
let didScroll = false;

function toMins(h, m) { return h * 60 + m; }

function getSlot() {
  const now = new Date();
  const cur = toMins(now.getHours(), now.getMinutes());
  const jsDay = now.getDay();
  const dayIdx = jsDay === 0 ? 6 : jsDay - 1;
  for (let i = 0; i < effectiveRows.length; i++) {
    const { s, e, overnight } = effectiveRows[i];
    const start = toMins(s[0], s[1]), end = toMins(e[0], e[1]);
    if (overnight ? (cur >= start || cur < end) : (cur >= start && cur < end)) return { row: i, day: dayIdx };
  }
  return null;
}

function highlight() {
  document.querySelectorAll('.active-cell').forEach(el => el.classList.remove('active-cell'));
  document.querySelectorAll('.active-row').forEach(el => el.classList.remove('active-row'));
  document.querySelectorAll('.today-hdr').forEach(el => el.classList.remove('today-hdr'));

  const slot = getSlot();
  if (!slot) return;
  const { row, day } = slot;
  document.getElementById('h' + day)?.classList.add('today-hdr');
  const tr = document.getElementById('r' + row);
  if (tr) tr.classList.add('active-row');
  const td = document.getElementById(`c${row}_${day}`);
  if (td) {
    td.classList.add('active-cell');
    if (!didScroll) { td.scrollIntoView({ behavior: 'smooth', block: 'center', inline: 'center' }); didScroll = true; }
  }
}

/* ─── Live time ──────────────────────────────────────────────────────── */
function updateTime() {
  const now = new Date();
  const days   = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  document.getElementById('live-time').textContent =
    `${days[now.getDay()]}, ${now.getDate()} ${months[now.getMonth()]} ${now.getFullYear()}  ·  ` +
    now.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
}

setInterval(() => { highlight(); updateTime(); }, 1000);

/* ─── Edit popover ───────────────────────────────────────────────────── */
function buildCatGrid() {
  const grid = document.getElementById('cat-grid');
  grid.innerHTML = '';
  CATEGORIES.forEach(([key, name]) => {
    const btn = document.createElement('button');
    btn.className = `cat-btn ${key}`;
    btn.dataset.cat = key;
    btn.textContent = name;
    btn.title = name;
    btn.addEventListener('click', () => selectCat(key));
    grid.appendChild(btn);
  });
}

function selectCat(cat) {
  selectedCat = cat;
  document.querySelectorAll('.cat-btn').forEach(b => {
    b.classList.toggle('selected', b.dataset.cat === cat);
  });
}

function openEdit(e, ri, di) {
  e.stopPropagation();
  const origCell = SCHEDULE_ROWS[ri].cells[di];
  const curCell  = effectiveRows[ri].cells[di];
  activeEdit = { ri, di, origLabel: origCell[0], origCat: origCell[1] };

  document.getElementById('pop-title').textContent =
    `Row ${ri + 1}  ·  ${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'][di]}`;
  document.getElementById('pop-label').value = curCell[0];
  selectCat(curCell[1]);

  const pop = document.getElementById('edit-popover');
  pop.style.display = 'block';

  // position near click, keep on screen
  const pw = 260, ph = 320;
  let x = e.clientX + 12, y = e.clientY - 40;
  if (x + pw > window.innerWidth  - 12) x = e.clientX - pw - 12;
  if (y + ph > window.innerHeight - 12) y = window.innerHeight - ph - 12;
  pop.style.left = x + 'px';
  pop.style.top  = Math.max(8, y) + 'px';

  document.getElementById('pop-label').focus();
}

function closeEdit() {
  document.getElementById('edit-popover').style.display = 'none';
  activeEdit = null;
}

async function saveEdit() {
  if (!activeEdit) return;
  const { ri, di } = activeEdit;
  const label    = document.getElementById('pop-label').value.trim();
  const category = selectedCat;
  if (!label || !category) return;

  await fetch('/schedule/overrides', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': token },
    body: JSON.stringify({ row_idx: ri, day_idx: di, label, category })
  });

  overrides[`${ri}_${di}`] = { label, category };
  effectiveRows[ri].cells[di] = [label, category];
  rebuildCell(ri, di);
  broadcastChange();
  closeEdit();
}

async function resetCell() {
  if (!activeEdit) return;
  const { ri, di } = activeEdit;

  await fetch(`/schedule/overrides/${ri}/${di}`, {
    method: 'DELETE', headers: { 'Authorization': token }
  });

  delete overrides[`${ri}_${di}`];
  effectiveRows[ri].cells[di] = [...SCHEDULE_ROWS[ri].cells[di]];
  rebuildCell(ri, di);
  broadcastChange();
  closeEdit();
}

function rebuildCell(ri, di) {
  const td = document.getElementById(`c${ri}_${di}`);
  if (!td) return;
  const [label, cat] = effectiveRows[ri].cells[di];
  td.className = cat + (overrides[`${ri}_${di}`] ? ' overridden' : '');
  td.innerHTML = `<span class="edit-icon">✎</span>${label}`;
  // re-add active classes if needed
  const slot = getSlot();
  if (slot && slot.row === ri && slot.day === di) td.classList.add('active-cell');
}

/* tell other tabs / dashboard to reload */
function broadcastChange() {
  localStorage.setItem('schedule_updated', Date.now().toString());
}

document.getElementById('pop-save').addEventListener('click', saveEdit);
document.getElementById('pop-reset').addEventListener('click', resetCell);
document.getElementById('pop-close').addEventListener('click', closeEdit);
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeEdit();
  if (e.key === 'Enter' && document.getElementById('edit-popover').style.display === 'block') saveEdit();
});
document.addEventListener('click', e => {
  const pop = document.getElementById('edit-popover');
  if (pop.style.display === 'block' && !pop.contains(e.target)) closeEdit();
});

/* ─── Analog clock ───────────────────────────────────────────────────── */
const cvs = document.getElementById('clock');
const ctx = cvs.getContext('2d');
const W = cvs.width, H = cvs.height, cx = W/2, cy = H/2, R = W/2 - 2;

function drawClock() {
  const now = new Date();
  const sec = now.getSeconds(), min = now.getMinutes(), hr = now.getHours() % 12;
  ctx.clearRect(0, 0, W, H);
  ctx.beginPath(); ctx.arc(cx,cy,R,0,Math.PI*2); ctx.fillStyle='#111'; ctx.fill();
  ctx.strokeStyle='#222'; ctx.lineWidth=1.5; ctx.stroke();
  for (let i=0;i<60;i++) {
    const a=(i/60)*Math.PI*2-Math.PI/2, isH=i%5===0, inner=isH?R*.74:R*.86;
    ctx.beginPath(); ctx.moveTo(cx+inner*Math.cos(a),cy+inner*Math.sin(a));
    ctx.lineTo(cx+R*.94*Math.cos(a),cy+R*.94*Math.sin(a));
    ctx.strokeStyle=isH?'#444':'#222'; ctx.lineWidth=isH?1.5:.8; ctx.stroke();
  }
  const hA=((hr+min/60)/12)*Math.PI*2-Math.PI/2;
  ctx.beginPath(); ctx.moveTo(cx-R*.12*Math.cos(hA),cy-R*.12*Math.sin(hA));
  ctx.lineTo(cx+R*.52*Math.cos(hA),cy+R*.52*Math.sin(hA));
  ctx.strokeStyle='#e0e0e0'; ctx.lineWidth=2.5; ctx.lineCap='round'; ctx.stroke();
  const mA=((min+sec/60)/60)*Math.PI*2-Math.PI/2;
  ctx.beginPath(); ctx.moveTo(cx-R*.14*Math.cos(mA),cy-R*.14*Math.sin(mA));
  ctx.lineTo(cx+R*.75*Math.cos(mA),cy+R*.75*Math.sin(mA));
  ctx.strokeStyle='#e0e0e0'; ctx.lineWidth=1.5; ctx.lineCap='round'; ctx.stroke();
  const sA=(sec/60)*Math.PI*2-Math.PI/2;
  ctx.beginPath(); ctx.moveTo(cx-R*.2*Math.cos(sA),cy-R*.2*Math.sin(sA));
  ctx.lineTo(cx+R*.85*Math.cos(sA),cy+R*.85*Math.sin(sA));
  ctx.strokeStyle='#2563eb'; ctx.lineWidth=1; ctx.lineCap='round'; ctx.stroke();
  ctx.beginPath(); ctx.arc(cx,cy,3,0,Math.PI*2); ctx.fillStyle='#2563eb'; ctx.fill();
  requestAnimationFrame(drawClock);
}

buildCatGrid();
init().then(() => drawClock());
</script>
</body>
</html>
