<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tracker — Score Calendar</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #080808;
      color: #ccc;
      min-height: 100vh;
    }

    /* ── Nav ─────────────────────────────────────────────────── */
    nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.85rem 1.5rem;
      border-bottom: 1px solid #161616;
    }

    .nav-links { display: flex; gap: 1.25rem; }
    .nav-links a {
      font-size: 0.78rem;
      color: #444;
      text-decoration: none;
    }
    .nav-links a:hover { color: #888; }

    nav h1 {
      font-size: 0.92rem;
      font-weight: 600;
      color: #fff;
      letter-spacing: -0.02em;
    }

    /* ── Page wrapper ───────────────────────────────────────── */
    .page { max-width: 780px; margin: 0 auto; padding: 2rem 1.25rem 4rem; }

    /* ── Month navigator ────────────────────────────────────── */
    .month-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.75rem;
    }

    .month-nav button {
      background: none;
      border: 1px solid #1e1e1e;
      color: #555;
      font-size: 1rem;
      width: 32px;
      height: 32px;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: border-color 0.15s, color 0.15s;
    }
    .month-nav button:hover { border-color: #444; color: #ccc; }

    .month-title {
      font-size: 1rem;
      font-weight: 600;
      color: #e0e0e0;
      letter-spacing: -0.02em;
    }

    /* ── Stats strip ────────────────────────────────────────── */
    .stats-strip {
      display: flex;
      gap: 1rem;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
    }

    .stat-card {
      flex: 1;
      min-width: 110px;
      background: #111;
      border: 1px solid #1a1a1a;
      border-radius: 10px;
      padding: 0.75rem 1rem;
    }

    .stat-label {
      font-size: 0.58rem;
      color: #444;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 0.3rem;
    }

    .stat-value {
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1;
    }

    /* ── Calendar grid ──────────────────────────────────────── */
    .dow-row {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
      margin-bottom: 4px;
    }

    .dow-cell {
      text-align: center;
      font-size: 0.6rem;
      color: #2e2e2e;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding: 0.2rem 0;
    }

    .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
    }

    .cal-day {
      aspect-ratio: 1;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      cursor: default;
      transition: filter 0.15s;
    }

    .cal-day:hover { filter: brightness(1.3); }

    .cal-day.empty { background: transparent; }
    .cal-day.no-data {
      background: #0f0f0f;
      border: 1px solid #161616;
    }

    .cal-day.today .day-num::after {
      content: '';
      display: block;
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: #2563eb;
      margin: 2px auto 0;
    }

    .day-num {
      font-size: 0.68rem;
      font-weight: 600;
      color: rgba(255,255,255,0.35);
      line-height: 1;
    }

    .day-score {
      font-size: 1.05rem;
      font-weight: 800;
      line-height: 1;
      margin-top: 2px;
      letter-spacing: -0.03em;
    }

    .day-entries {
      font-size: 0.48rem;
      margin-top: 2px;
      opacity: 0.5;
    }

    /* score colour scale */
    .s1 { background: #1a0606; }
    .s1 .day-score { color: #f87171; }
    .s2 { background: #1a0e04; }
    .s2 .day-score { color: #fb923c; }
    .s3 { background: #141007; }
    .s3 .day-score { color: #fbbf24; }
    .s4 { background: #071409; }
    .s4 .day-score { color: #4ade80; }
    .s5 { background: #071a0a; }
    .s5 .day-score { color: #86efac; box-shadow: 0 0 8px rgba(134,239,172,0.25); }

    /* ── Legend ────────────────────────────────────────────── */
    .legend {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      margin-top: 1.25rem;
      flex-wrap: wrap;
    }

    .legend-label {
      font-size: 0.58rem;
      color: #2e2e2e;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      margin-right: 0.25rem;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 0.3rem;
      font-size: 0.58rem;
      color: #444;
    }

    .legend-dot {
      width: 8px;
      height: 8px;
      border-radius: 3px;
      flex-shrink: 0;
    }

    /* ── Tooltip ────────────────────────────────────────────── */
    .tooltip {
      position: fixed;
      background: #161616;
      border: 1px solid #2a2a2a;
      border-radius: 8px;
      padding: 0.55rem 0.8rem;
      font-size: 0.7rem;
      color: #ccc;
      pointer-events: none;
      z-index: 999;
      display: none;
      line-height: 1.6;
      max-width: 200px;
    }
    .tooltip b { color: #fff; }
    .tooltip .tt-score { font-size: 1rem; font-weight: 800; }
  </style>
</head>
<body>

<nav>
  <div class="nav-links">
    <a href="dashboard.html">← Dashboard</a>
    <a href="schedule.html">Schedule</a>
    <a href="dayplan.html">Ideal Day</a>
    <a href="profile.html">Profile</a>
  </div>
  <h1>Score Calendar</h1>
  <div style="width:120px;text-align:right;">
    <a href="dashboard.html" style="font-size:0.78rem;color:#444;text-decoration:none;" onmouseover="this.style.color='#888'" onmouseout="this.style.color='#444'">Sign out ↗</a>
  </div>
</nav>

<div class="page">

  <div class="stats-strip">
    <div class="stat-card">
      <div class="stat-label">Month avg</div>
      <div class="stat-value" id="stat-avg" style="color:#fff;">—</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Best day</div>
      <div class="stat-value" id="stat-best" style="color:#86efac;">—</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Logged days</div>
      <div class="stat-value" id="stat-days" style="color:#60a5fa;">—</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Total entries</div>
      <div class="stat-value" id="stat-entries" style="color:#c084fc;">—</div>
    </div>
  </div>

  <div class="month-nav">
    <button id="prev" title="Previous month">‹</button>
    <span class="month-title" id="month-title"></span>
    <button id="next" title="Next month">›</button>
  </div>

  <div class="dow-row">
    <div class="dow-cell">Sun</div>
    <div class="dow-cell">Mon</div>
    <div class="dow-cell">Tue</div>
    <div class="dow-cell">Wed</div>
    <div class="dow-cell">Thu</div>
    <div class="dow-cell">Fri</div>
    <div class="dow-cell">Sat</div>
  </div>

  <div class="cal-grid" id="cal-grid"></div>

  <div class="legend">
    <span class="legend-label">Score</span>
    <div class="legend-item"><span class="legend-dot" style="background:#1a0606;border:1px solid #f87171;"></span>1 — Lost</div>
    <div class="legend-item"><span class="legend-dot" style="background:#1a0e04;border:1px solid #fb923c;"></span>2 — Heavy drift</div>
    <div class="legend-item"><span class="legend-dot" style="background:#141007;border:1px solid #fbbf24;"></span>3 — Partial</div>
    <div class="legend-item"><span class="legend-dot" style="background:#071409;border:1px solid #4ade80;"></span>4 — Focused</div>
    <div class="legend-item"><span class="legend-dot" style="background:#071a0a;border:1px solid #86efac;"></span>5 — Deep work</div>
  </div>

</div>

<div class="tooltip" id="tooltip"></div>

<script>
  const token = localStorage.getItem('token');
  if (!token) window.location.href = 'login.html';

  const MONTHS = ['January','February','March','April','May','June',
                  'July','August','September','October','November','December'];

  let scoreMap  = {};  // "YYYY-MM-DD" → { avg_score, entries }
  let curYear   = new Date().getFullYear();
  let curMonth  = new Date().getMonth();   // 0-indexed

  async function loadScores() {
    const res = await fetch('/scores/daily', { headers: { 'Authorization': token } });
    if (res.status === 401 || res.status === 403) {
      localStorage.removeItem('token');
      window.location.href = 'login.html';
      return;
    }
    const data = await res.json();
    scoreMap = {};
    data.forEach(row => { scoreMap[row.day] = { avg: row.avg_score, entries: row.entries }; });
    render();
  }

  function scoreClass(avg) {
    const r = Math.round(avg);
    return 's' + Math.min(5, Math.max(1, r));
  }

  function pad(n) { return String(n).padStart(2, '0'); }

  function render() {
    const monthKey = `${curYear}-${pad(curMonth + 1)}`;
    document.getElementById('month-title').textContent = `${MONTHS[curMonth]} ${curYear}`;

    // stats for this month
    const monthEntries = Object.entries(scoreMap).filter(([d]) => d.startsWith(monthKey));
    const totalEntries = monthEntries.reduce((s, [, v]) => s + v.entries, 0);
    const loggedDays   = monthEntries.length;
    const avgScore     = loggedDays
      ? (monthEntries.reduce((s, [, v]) => s + v.avg, 0) / loggedDays).toFixed(1)
      : null;
    const bestScore    = loggedDays
      ? Math.max(...monthEntries.map(([, v]) => v.avg)).toFixed(1)
      : null;

    document.getElementById('stat-avg').textContent     = avgScore  ?? '—';
    document.getElementById('stat-best').textContent    = bestScore ?? '—';
    document.getElementById('stat-days').textContent    = loggedDays || '—';
    document.getElementById('stat-entries').textContent = totalEntries || '—';

    // calendar cells
    const grid    = document.getElementById('cal-grid');
    grid.innerHTML = '';

    const firstDow = new Date(curYear, curMonth, 1).getDay();  // 0=Sun
    const daysInMonth = new Date(curYear, curMonth + 1, 0).getDate();
    const today = new Date();
    const todayStr = `${today.getFullYear()}-${pad(today.getMonth()+1)}-${pad(today.getDate())}`;

    // empty leading cells
    for (let i = 0; i < firstDow; i++) {
      const el = document.createElement('div');
      el.className = 'cal-day empty';
      grid.appendChild(el);
    }

    for (let d = 1; d <= daysInMonth; d++) {
      const dateStr = `${curYear}-${pad(curMonth + 1)}-${pad(d)}`;
      const data    = scoreMap[dateStr];
      const isToday = dateStr === todayStr;

      const cell = document.createElement('div');
      cell.className = `cal-day ${data ? scoreClass(data.avg) : 'no-data'}${isToday ? ' today' : ''}`;

      const numEl = document.createElement('div');
      numEl.className = 'day-num';
      numEl.textContent = d;
      cell.appendChild(numEl);

      if (data) {
        const scoreEl = document.createElement('div');
        scoreEl.className = 'day-score';
        scoreEl.textContent = data.avg % 1 === 0 ? data.avg.toFixed(0) : data.avg.toFixed(1);
        cell.appendChild(scoreEl);

        const entEl = document.createElement('div');
        entEl.className = 'day-entries';
        entEl.textContent = data.entries + (data.entries === 1 ? ' entry' : ' entries');
        cell.appendChild(entEl);

        // tooltip
        cell.addEventListener('mousemove', e => {
          const tt = document.getElementById('tooltip');
          tt.innerHTML = `<b>${dateStr}</b><br>
            <span class="tt-score">${data.avg.toFixed(2)}</span> avg score<br>
            ${data.entries} log ${data.entries === 1 ? 'entry' : 'entries'}`;
          tt.style.display = 'block';
          tt.style.left = (e.clientX + 14) + 'px';
          tt.style.top  = (e.clientY - 10) + 'px';
        });
        cell.addEventListener('mouseleave', () => {
          document.getElementById('tooltip').style.display = 'none';
        });
      }

      grid.appendChild(cell);
    }
  }

  document.getElementById('prev').addEventListener('click', () => {
    curMonth--;
    if (curMonth < 0) { curMonth = 11; curYear--; }
    render();
  });

  document.getElementById('next').addEventListener('click', () => {
    curMonth++;
    if (curMonth > 11) { curMonth = 0; curYear++; }
    render();
  });

  loadScores();
</script>
</body>
</html>
