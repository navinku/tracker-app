name: Sync to GitLab

on:
  push:
    branches:
      - main  # Sync only when there are changes to the main branch

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out the GitHub repository
      - name: Check out source repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0  # Fetch the entire history to avoid shallow clone issues

      # Step 2: Add GitLab as a remote and push changes
      - name: Sync to GitLab
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          GITLAB_USERNAME: ${{ secrets.GITLAB_USERNAME }}
          GITLAB_EMAIL: ${{ secrets.GITLAB_EMAIL }}
          GITLAB_URL: ${{ secrets.GITLAB_URL }}
        run: |
          set -euo pipefail

          # Configure Git user
          git config --global user.name "${GITLAB_USERNAME}"
          git config --global user.email "${GITLAB_EMAIL}"

          # Normalize the GitLab repo URL.
          # Accept values like:
          #   gitlab.com/group/project.git
          #   https://gitlab.com/group/project.git
          GITLAB_REPO="${GITLAB_URL#https://}"
          GITLAB_REPO="${GITLAB_REPO#http://}"
          GITLAB_REPO="${GITLAB_REPO%/}"

          if [ -z "${GITLAB_REPO}" ] || [ -z "${GITLAB_TOKEN}" ]; then
            echo "Error: GITLAB_URL and GITLAB_TOKEN must be configured."
            exit 1
          fi

          REMOTE_URL="https://oauth2:${GITLAB_TOKEN}@${GITLAB_REPO}"

          # Remove an old remote if present and recreate it with the correct URL.
          git remote remove gitlab >/dev/null 2>&1 || true
          git remote add gitlab "${REMOTE_URL}"

          git fetch gitlab main || true
          git push --force-with-lease gitlab HEAD:main
