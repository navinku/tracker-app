name: Sync to GitLab

on:
  push:
    branches:
      - main

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      # ------------------------------------------------------------
      # 1. Checkout GitHub repository
      # ------------------------------------------------------------
      - name: Check out source repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ------------------------------------------------------------
      # 2. Sync GitHub main -> GitLab main
      # ------------------------------------------------------------
      - name: Sync to GitLab
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          GITLAB_USERNAME: ${{ secrets.GITLAB_USERNAME }}
          GITLAB_EMAIL: ${{ secrets.GITLAB_EMAIL }}
          GITLAB_URL: ${{ secrets.GITLAB_URL }}
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Configuring Git"
          echo "=========================================="

          git config --global user.name "${GITLAB_USERNAME}"
          git config --global user.email "${GITLAB_EMAIL}"

          # --------------------------------------------------------
          # Validate required variables
          # --------------------------------------------------------
          if [ -z "${GITLAB_TOKEN}" ]; then
            echo "ERROR: GITLAB_TOKEN is not configured."
            exit 1
          fi

          if [ -z "${GITLAB_USERNAME}" ]; then
            echo "ERROR: GITLAB_USERNAME is not configured."
            exit 1
          fi

          if [ -z "${GITLAB_EMAIL}" ]; then
            echo "ERROR: GITLAB_EMAIL is not configured."
            exit 1
          fi

          if [ -z "${GITLAB_URL}" ]; then
            echo "ERROR: GITLAB_URL is not configured."
            exit 1
          fi

          # --------------------------------------------------------
          # Normalize GitLab repository URL
          #
          # Supported:
          #   gitlab.com/group/project.git
          #   https://gitlab.com/group/project.git
          #   http://gitlab.com/group/project.git
          # --------------------------------------------------------
          GITLAB_REPO="${GITLAB_URL#https://}"
          GITLAB_REPO="${GITLAB_REPO#http://}"
          GITLAB_REPO="${GITLAB_REPO%/}"

          echo "GitLab repository: ${GITLAB_REPO}"

          # --------------------------------------------------------
          # Configure authenticated GitLab remote
          # --------------------------------------------------------
          REMOTE_URL="https://oauth2:${GITLAB_TOKEN}@${GITLAB_REPO}"

          git remote remove gitlab >/dev/null 2>&1 || true
          git remote add gitlab "${REMOTE_URL}"

          # --------------------------------------------------------
          # Verify GitLab authentication and repository access
          # --------------------------------------------------------
          echo "=========================================="
          echo "Testing GitLab authentication"
          echo "=========================================="

          git ls-remote gitlab HEAD

          echo "GitLab authentication successful."

          # --------------------------------------------------------
          # Fetch GitLab main
          # --------------------------------------------------------
          echo "=========================================="
          echo "Fetching GitLab main"
          echo "=========================================="

          git fetch gitlab main

          echo "GitLab fetch successful."

          # --------------------------------------------------------
          # Push GitHub main -> GitLab main
          # --------------------------------------------------------
          echo "=========================================="
          echo "Pushing GitHub main -> GitLab main"
          echo "=========================================="

          git push --force-with-lease gitlab HEAD:main

          echo "=========================================="
          echo "GitLab synchronization completed successfully"
          echo "=========================================="
