name: Test GitLab Authentication

on:
  push:
    branches:
      - main

jobs:
  test-gitlab:
    runs-on: ubuntu-latest

    steps:
      - name: Test GitLab token
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          GITLAB_USERNAME: ${{ secrets.GITLAB_USERNAME }}
          GITLAB_URL: ${{ secrets.GITLAB_URL }}
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "GitLab Configuration"
          echo "=========================================="

          if [ -z "${GITLAB_TOKEN}" ]; then
            echo "ERROR: GITLAB_TOKEN is empty"
            exit 1
          fi

          if [ -z "${GITLAB_URL}" ]; then
            echo "ERROR: GITLAB_URL is empty"
            exit 1
          fi

          GITLAB_REPO="${GITLAB_URL#https://}"
          GITLAB_REPO="${GITLAB_REPO#http://}"
          GITLAB_REPO="${GITLAB_REPO%/}"

          GITLAB_HOST="${GITLAB_REPO%%/*}"

          echo "GitLab host: ${GITLAB_HOST}"
          echo "GitLab repository: ${GITLAB_REPO}"
          echo "Token length: ${#GITLAB_TOKEN}"

          echo "=========================================="
          echo "1. Testing GitLab API authentication"
          echo "=========================================="

          curl \
            --fail \
            --silent \
            --show-error \
            --header "PRIVATE-TOKEN: ${GITLAB_TOKEN}" \
            "https://${GITLAB_HOST}/api/v4/user"

          echo ""
          echo "GitLab API authentication: SUCCESS"

          echo "=========================================="
          echo "2. Testing Git repository authentication"
          echo "=========================================="

          git ls-remote \
            "https://oauth2:${GITLAB_TOKEN}@${GITLAB_REPO}" \
            HEAD

          echo ""
          echo "Git repository authentication: SUCCESS"
