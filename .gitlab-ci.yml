stages:
  - build_and_push

build_and_push:
  stage: build_and_push
  image: docker:latest
  services:
    - docker:dind
  before_script:
    - apk add --no-cache aws-cli
    - aws configure set aws_access_key_id $AWS_ACCESS_KEY_ID
    - aws configure set aws_secret_access_key $AWS_SECRET_ACCESS_KEY
    - aws configure set region us-east-2
    - aws ecr get-login-password --region us-east-2 | docker login --username AWS --password-stdin 589535355002.dkr.ecr.us-east-2.amazonaws.com
  script:
    - docker build -t tracker-app .
    - docker tag tracker-app:latest 589535355002.dkr.ecr.us-east-2.amazonaws.com/tracker-app:$CI_COMMIT_REF_SLUG
    - docker tag tracker-app:latest 589535355002.dkr.ecr.us-east-2.amazonaws.com/tracker-app:latest
    - docker push 589535355002.dkr.ecr.us-east-2.amazonaws.com/tracker-app:$CI_COMMIT_REF_SLUG
    - docker push 589535355002.dkr.ecr.us-east-2.amazonaws.com/tracker-app:latest
  only:
    - main